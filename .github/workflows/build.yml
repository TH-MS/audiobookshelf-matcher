name: Build Portable EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Dependencies & PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter requests pillow mutagen pyinstaller
        
    - name: Build Executable
      run: |
        pyinstaller --noconfirm --clean --onedir --noconsole --name "Audiobookshelf Matcher Portable" --collect-all customtkinter "Audiobook Match.py"
        
    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Audiobookshelf-Matcher-Portable
        path: dist/Audiobookshelf Matcher Portable/
